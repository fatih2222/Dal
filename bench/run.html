<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dal ölçüm</title>
<style>
  body { font: 14px/1.5 system-ui, sans-serif; margin: 16px; color: #222; background: #fafafa; }
  table { border-collapse: collapse; margin: 8px 0 16px; }
  td, th { border: 1px solid #ccc; padding: 3px 8px; text-align: right; }
  th:first-child, td:first-child { text-align: left; }
  pre { white-space: pre-wrap; overflow-wrap: anywhere; }
  iframe { width: 10px; height: 10px; border: 0; position: fixed; right: 0; bottom: 0; }
</style>
</head>
<body>
<h1>Dal zorluk puanı ölçümü</h1>
<p>Veri: OneStopEnglish (Vajjala ve Lučić 2018, CC BY-SA 4.0), 189 haberin Elementary, Intermediate ve Advanced sürümleri.
Veriyi indirmek için bench/README.md dosyasına bak. API'ye istek gönderilmez.</p>
<div id="status">Çalışıyor…</div>
<div id="out"></div>
<script>
"use strict";
const B = { done: false };
window.__B = B;
const LEVELS = ["ele", "int", "adv"];

// ---- helpers ----
const mean = (a) => a.reduce((x, y) => x + y, 0) / a.length;
const median = (a) => { const s = [...a].sort((x, y) => x - y); const m = s.length >> 1; return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2; };
const sd = (a) => { const m = mean(a); return Math.sqrt(mean(a.map((x) => (x - m) ** 2))); };
function ranks(a) {
  const idx = a.map((v, i) => [v, i]).sort((x, y) => x[0] - y[0]);
  const r = new Array(a.length);
  for (let i = 0; i < idx.length;) {
    let j = i; while (j + 1 < idx.length && idx[j + 1][0] === idx[i][0]) j++;
    const avg = (i + j) / 2 + 1;
    for (let k = i; k <= j; k++) r[idx[k][1]] = avg;
    i = j + 1;
  }
  return r;
}
function pearson(x, y) { const mx = mean(x), my = mean(y); let n = 0, dx = 0, dy = 0; x.forEach((v, i) => { n += (v - mx) * (y[i] - my); dx += (v - mx) ** 2; dy += (y[i] - my) ** 2; }); return n / Math.sqrt(dx * dy); }
const spearman = (x, y) => pearson(ranks(x), ranks(y));
const r2 = (x) => Math.round(x * 100) / 100, r1 = (x) => Math.round(x * 10) / 10;

function syllables(w) {
  w = w.toLowerCase().replace(/[^a-z]/g, "");
  if (!w) return 0;
  if (w.length <= 3) return 1;
  w = w.replace(/(?:[^laeiouy]es|ed|[^laeiouy]e)$/, "").replace(/^y/, "");
  const m = w.match(/[aeiouy]{1,2}/g);
  return Math.max(1, m ? m.length : 1);
}

let A; // evaluates inside the app frame
async function loadApp() {
  const f = document.createElement("iframe");
  document.body.append(f);
  await new Promise((r) => { f.onload = r; f.src = "../index.html?test&bench=" + Date.now(); });
  A = (e) => f.contentWindow.eval(e);
  for (let i = 0; i < 100 && !A("typeof measure === 'function'"); i++) await new Promise((r) => setTimeout(r, 50));
}

// The Intermediate files lost every apostrophe ("dont", "theyre"). Put the common contractions back so that
// they are not counted as unknown words; possessives ("citys") already reduce to their stem.
const CONTR = { dont: "don't", doesnt: "doesn't", didnt: "didn't", isnt: "isn't", arent: "aren't", wasnt: "wasn't", werent: "weren't", cant: "can't", couldnt: "couldn't", wouldnt: "wouldn't", shouldnt: "shouldn't", wont: "won't", hasnt: "hasn't", havent: "haven't", hadnt: "hadn't", mustnt: "mustn't", neednt: "needn't", theyre: "they're", youre: "you're", weve: "we've", theyve: "they've", youve: "you've", ive: "I've", im: "I'm", theyll: "they'll", youll: "you'll", itll: "it'll", thats: "that's", whats: "what's", theres: "there's", heres: "here's", whos: "who's", hes: "he's", shes: "she's", lets: "let's" };
B.fixed = 0; B.lig = 0;
// Some source PDFs lost the fi/fl/ff ligatures ("signi cant", "rst", "e ort"). Put them back where that
// yields a listed word and the broken piece is not a word itself.
const LIGS = ["ffi", "ffl", "fi", "fl", "ff"];
function repairLigatures(l) {
  const known = (w) => !!A("wordLevel")(w.toLowerCase());
  l = l.replace(/\b([A-Za-z]+) ([a-z]+)\b/g, (m, a, b) => {
    if (known(a) && known(b)) return m;
    for (const g of LIGS) if (known(a + g + b)) { B.lig++; return a + g + b; }
    return m;
  });
  // Whole tokens only, never the part after an apostrophe ("don't" must stay as it is).
  return l.replace(/(?<![A-Za-z'’-])([A-Za-z]{2,})(?![A-Za-z'’-])/g, (w) => {
    if (known(w)) return w;
    for (const g of LIGS) {
      if (known(g + w)) { B.lig++; return (w[0] === w[0].toUpperCase() ? g[0].toUpperCase() + g.slice(1) : g) + w.toLowerCase(); }
      if (known(w + g)) { B.lig++; return w + g; }
    }
    return w;
  });
}
function cleanText(raw) {
  const lines = raw.replace(/^﻿/, "").replace(/\r/g, "").split("\n").map((l) => l.trim()).filter(Boolean);
  return lines.filter((l) => !/^(elementary|intermediate|advanced)$/i.test(l))
    .map((l) => /['’]/.test(l) ? l : l.replace(/\b[A-Za-z]+\b/g, (w) => { const c = CONTR[w.toLowerCase()]; if (!c) return w; B.fixed++; return w[0] === w[0].toUpperCase() && c[0] !== "I" ? c[0].toUpperCase() + c.slice(1) : c; }))
    .map(repairLigatures);
}

// Same exclusions as the app's measure(), but every occurrence counts (standard token coverage).
function measureTokens(paragraphs) {
  const WORD_RE = A("WORD_RE"), norm = A("norm"), wordInfo = A("wordInfo"), split = A("splitSentences"), scoreAt = A("scoreAt");
  const counts = [0, 0, 0, 0, 0, 0, 0, 0]; let n = 0;
  paragraphs.forEach((p) => split(p).forEach((s) => {
    let first = true;
    for (const m of s.matchAll(WORD_RE)) {
      const raw = m[0], isFirst = first; first = false;
      if (/^\d/.test(raw)) continue;
      let info = wordInfo(norm(raw));
      if (raw === "I" || /^I['’]/.test(raw)) info = { l: 1 };
      else if (raw[0] !== raw[0].toLowerCase() && (!isFirst || !info || info.freq)) continue;
      counts[info ? info.l : 7]++; n++;
    }
  }));
  return { score: scoreAt(counts, n, 0.95), score98: scoreAt(counts, n, 0.98), counts, n };
}

function analyse(paragraphs) {
  const measure = A("measure"), split = A("splitSentences"), WORD_RE = A("WORD_RE"), norm = A("norm"), wordInfo = A("wordInfo");
  const m = measure(paragraphs, 47, []);
  const tok = measureTokens(paragraphs);
  const sents = paragraphs.flatMap((p) => split(p));
  const words = paragraphs.join(" ").match(/[A-Za-z]+(?:['’][A-Za-z]+)?/g) || [];
  const syl = words.reduce((a, w) => a + syllables(w), 0);
  const asl = words.length / Math.max(1, sents.length), asw = syl / Math.max(1, words.length);
  // Off-list (level 7) lowercase words, for the error analysis.
  const off = [];
  paragraphs.forEach((p) => split(p).forEach((s) => {
    let first = true;
    for (const mm of s.matchAll(WORD_RE)) {
      const raw = mm[0], isFirst = first; first = false;
      if (/^\d/.test(raw) || raw === "I") continue;
      const low = norm(raw), info = wordInfo(low);
      if (raw[0] !== raw[0].toLowerCase() && (!isFirst || !info)) continue;
      if (!info) off.push(low);
    }
  }));
  return {
    dal: m.score, dal98: m.at(0.98), tok: tok.score, tok98: tok.score98,
    fk: 0.39 * asl + 11.8 * asw - 15.59, asl, awl: words.reduce((a, w) => a + w.length, 0) / Math.max(1, words.length),
    n: m.n, words: words.length, offShare: m.counts[7] / Math.max(1, m.n), off,
  };
}

async function main() {
  await loadApp();
  const manifest = await (await fetch("data/ose-manifest.json")).json();
  const rows = [];
  let k = 0;
  for (const item of manifest) {
    const row = { stem: item.stem };
    for (const lv of LEVELS) {
      const raw = await (await fetch("data/ose/Texts-SeparatedByReadingLevel/" + item[lv])).text();
      row[lv] = analyse(cleanText(raw));
    }
    rows.push(row);
    if (++k % 20 === 0) document.getElementById("status").textContent = `${k}/${manifest.length} haber…`;
  }
  B.rows = rows;
  report(rows);
  B.done = true;
  document.getElementById("status").textContent = "Bitti.";
}

function report(rows) {
  const metrics = [["dal", "Dal puanı (%95, tekrarlar bir kez)"], ["dal98", "Dal puanı (%98)"], ["tok", "Standart kapsam (%95, her geçiş)"], ["tok98", "Standart kapsam (%98)"], ["fk", "Flesch-Kincaid sınıf düzeyi"], ["asl", "Ortalama cümle uzunluğu"], ["awl", "Ortalama kelime uzunluğu"]];
  const lvNum = { ele: 1, int: 2, adv: 3 };
  const res = {};
  for (const [k] of metrics) {
    const all = [], lab = [];
    rows.forEach((r) => LEVELS.forEach((lv) => { all.push(r[lv][k]); lab.push(lvNum[lv]); }));
    let pairOk = 0, pairN = 0, triOk = 0, eiOk = 0, iaOk = 0;
    rows.forEach((r) => {
      const [e, i, a] = LEVELS.map((lv) => r[lv][k]);
      if (e < i) eiOk++; if (i < a) iaOk++;
      [[e, i], [i, a], [e, a]].forEach(([x, y]) => { pairN++; if (x < y) pairOk++; });
      if (e < i && i < a) triOk++;
    });
    const per = Object.fromEntries(LEVELS.map((lv) => { const v = rows.map((r) => r[lv][k]); return [lv, { mean: r1(mean(v)), median: r1(median(v)), sd: r1(sd(v)) }]; }));
    res[k] = { spearman: r2(spearman(all, lab)), pairAcc: r2(pairOk / pairN), tripletAcc: r2(triOk / rows.length), eiAcc: r2(eiOk / rows.length), iaAcc: r2(iaOk / rows.length), per };
  }
  // CEFR band of the Dal score per level.
  const bandOf = A("bandOf"), LV = A("LV");
  const bands = Object.fromEntries(LEVELS.map((lv) => { const c = {}; rows.forEach((r) => { const b = r[lv].dal >= 100 ? "liste dışı" : LV[bandOf(r[lv].dal) - 1]; c[b] = (c[b] || 0) + 1; }); return [lv, c]; }));
  // Most frequent off-list words.
  const offCount = {};
  rows.forEach((r) => LEVELS.forEach((lv) => r[lv].off.forEach((w) => { offCount[w] = (offCount[w] || 0) + 1; })));
  const topOff = Object.entries(offCount).sort((a, b) => b[1] - a[1]).slice(0, 120);
  const offShare = Object.fromEntries(LEVELS.map((lv) => [lv, r2(mean(rows.map((r) => r[lv].offShare)) * 100)]));
  B.summary = { res, bands, offShare, topOff, n: rows.length };

  let html = "<table><tr><th>Ölçüt</th><th>Spearman</th><th>Çift doğruluğu</th><th>Üçlü doğruluğu</th><th>Ele&lt;Int</th><th>Int&lt;Adv</th><th>Ele ort.</th><th>Int ort.</th><th>Adv ort.</th></tr>";
  for (const [k, name] of metrics) {
    const x = res[k];
    html += `<tr><td>${name}</td><td>${x.spearman}</td><td>${x.pairAcc}</td><td>${x.tripletAcc}</td><td>${x.eiAcc}</td><td>${x.iaAcc}</td><td>${x.per.ele.mean}</td><td>${x.per.int.mean}</td><td>${x.per.adv.mean}</td></tr>`;
  }
  html += "</table><h2>Dal puanının CEFR dağılımı</h2><pre>" + JSON.stringify(bands, null, 1) + "</pre>";
  html += "<h2>Listede olmayan kelimelerin payı (%)</h2><pre>" + JSON.stringify(offShare) + "</pre>";
  html += "<h2>En sık listede olmayan kelimeler</h2><pre>" + topOff.map(([w, c]) => `${w} ${c}`).join(", ") + "</pre>";
  document.getElementById("out").innerHTML = html;
}
main().catch((e) => { document.getElementById("status").textContent = "Hata: " + (e && e.stack || e); B.error = String(e); B.done = true; });
</script>
</body>
</html>
